name: Deploy to Cloudflare Workers

# Every push that lands on main — a direct push or a merged PR alike.
on:
  push:
    branches: [main]

# If a second push lands before the first deploy finishes, only the newest
# commit on main should end up live — cancel the stale run rather than let
# two deploys race.
concurrency:
  group: deploy-main
  cancel-in-progress: true

# Not a secret — this is the same domain already hardcoded into index.html,
# robots.txt, and sitemap.xml (see "Why the domain is hardcoded" in
# README.md). Kept in one place here so a future domain change only touches
# one line in this file.
env:
  LIVE_DOMAIN: https://ladder-snake.mfrazi.me

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # Cloudflare uploads script.js/data.js/sw.js as opaque static assets —
      # it never parses them, so a broken commit would otherwise ship with
      # no warning until a real browser hit it.
      - name: Syntax-check the served JS
        run: |
          for f in script.js data.js sw.js; do
            node --check "$f"
          done

      # Same command `npm run deploy` runs locally — CI and a human running
      # it by hand do exactly the same thing. wrangler reads these two env
      # vars natively for non-interactive auth; no extra action needed.
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # `wrangler deploy` succeeding only proves *a* Worker got updated — not
      # that it's the one the live custom domain is actually bound to (see
      # the deploy-identity caveat in README.md: wrangler.jsonc's "name" is
      # the deploy identity, and a custom domain doesn't follow a rename in
      # this file). This proves it for real: pull the BUILD marker straight
      # off the live site and fail loudly if it doesn't match what this run
      # just pushed, rather than trusting wrangler's exit code alone.
      - name: Verify the live custom domain actually updated
        run: |
          expected=$(grep -oE "BUILD = '[^']*'" script.js | grep -oE "'[^']*'" | tr -d "'")
          echo "expected BUILD: $expected"

          for i in $(seq 1 10); do
            live=$(curl -fsS "$LIVE_DOMAIN/script.js" 2>/dev/null \
              | grep -oE "BUILD = '[^']*'" | grep -oE "'[^']*'" | tr -d "'" || true)
            echo "attempt $i — live BUILD: ${live:-<unreachable>}"
            if [ "$live" = "$expected" ]; then
              echo "Confirmed: $LIVE_DOMAIN is serving this exact deploy."
              exit 0
            fi
            sleep 5
          done

          echo "::error::wrangler deploy reported success, but $LIVE_DOMAIN is still not serving BUILD $expected after ~50s."
          echo "::error::This means the custom domain is very likely bound to a different Worker than the one 'wrangler deploy' just updated under the 'name' in wrangler.jsonc — see the deploy-identity caveat in README.md."
          exit 1
